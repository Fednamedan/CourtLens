llm:
  provider: openai_compatible      # заменяется без правки кода
  base_url: ${LLM_BASE_URL}
  api_key: ${LLM_API_KEY}
  model: gpt-oss-120b              # или qwen3.6-35b-a3b, или модель Яндекса
  temperature: 0
  max_tokens: 2048
  timeout_s: 60
  retries: 3

ocr:
  engine: tesseract                # tesseract | paddle | vision_llm
  lang: rus
  dpi: 300
  psm: 6
  preprocess: none                 # none | deskew | denoise
  tessdata_dir: data/tessdata

ingestion:
  blank_page_conf: 0.45   # страницы с OCR-уверенностью ниже считаются пустыми
  min_chars_per_page: 40           # меньше - страница считается сканом
  min_cyrillic_share: 0.3

validation:
  low_confidence_below: 0.6

legal:
  keywords_file: data/keywords.txt
  fuzzy_threshold: 90

notify:
  smtp_security: starttls          # starttls | ssl | none; отправка включается флагом --notify
  dry_run_dir: out/emails
  smtp_host: ${SMTP_HOST}
  smtp_port: 587
  smtp_user: ${SMTP_USER}
  smtp_password: ${SMTP_PASSWORD}
  to: ${LEGAL_EMAIL}
